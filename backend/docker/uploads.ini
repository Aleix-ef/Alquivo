; Match Laravel's document (10 MB) and property photo (6 MB) validation.
; The request limit includes the multipart form overhead.
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off
zend.exception_ignore_args = On
; Alquivo uses Laravel's database sessions, not PHP's native upload-progress state.
; PHP advisory 2026-10-23 / CVE-2026-115560: apply before request parsing.
session.upload_progress.enabled = Off
