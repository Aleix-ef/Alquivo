# Despliegue independiente para un VPS. Usar --env-file .env.production.
# No combinar con docker-compose.yml (exclusivo del entorno local).
name: alquivo-production

# Requires ops/server/60-alquivo-retention.conf on the systemd VPS before rollout.
# Native journald retention; never truncate Docker-managed files externally.
x-logging: &logging
  driver: journald
  options:
    tag: "alquivo-{{.Name}}"

x-runtime: &runtime
  build: ./backend
  env_file: ${APP_ENV_FILE:-.env.production}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    # Only PostgreSQL needs the administrator credential, never PHP/workers.
    DATABASE_ADMIN_PASSWORD: ""
  volumes:
    - private_storage:/app/storage/app
    - document_keys:/app/storage/app/keys
    - app_logs:/app/storage/logs
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  backend:
    <<: *runtime
    command: ["sh", "-c", "php artisan security:check && php-fpm"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  worker:
    <<: *runtime
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=90"]
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *runtime
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-}
        VITE_SEO_INDEXABLE: ${VITE_SEO_INDEXABLE:-false}
        VITE_BETA_PROGRAM_ENABLED: ${BETA_PROGRAM_ENABLED:-true}
    networks:
      default:
        ipv4_address: 172.30.20.10
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  clamav:
    logging: *logging
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    # La imagen oficial incluye comprobación de salud. Sin puerto público.

  postgres:
    logging: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?Set a unique administrator password}
      POSTGRES_DB: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set a different application password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/init-database.sql:/docker-entrypoint-initdb.d/10-alquivo.sql:ro
    healthcheck:
      # pg_isready succeeds even when the requested database/role is missing.
      # Authenticate as the actual app user without putting the password in argv.
      test: ["CMD-SHELL", "PGPASSWORD=\"$${DB_PASSWORD}\" psql -h 127.0.0.1 -U alquivo -d alquivo -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  proxy:
    logging: *logging
    image: caddy:2-alpine
    networks:
      default:
        ipv4_address: 172.30.20.11
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set your real domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  private_storage:
  app_logs:
  clamav_data:
  postgres_data:
  document_keys:
  caddy_data:
  caddy_config:
