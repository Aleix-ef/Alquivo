# Install only after testing a NEW public-key login and sudo access.
# 00- takes precedence over cloud-init's 50-cloud-init.conf (first value wins).
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowAgentForwarding no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
