# Install as /etc/systemd/journald.conf.d/60-alquivo-retention.conf on the VPS.
# Covers this host's journal, including container stdout/stderr after recreation.
# Application files and the database security audit retain their own 14/30 days.
[Journal]
Storage=persistent
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=16M
RuntimeMaxUse=64M
RuntimeKeepFree=64M
MaxRetentionSec=30day
MaxFileSec=1day
