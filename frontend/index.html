<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2747" />
    <meta name="description" content="Nareo reúne tus propiedades, alquileres, gastos y rentabilidad en un único lugar." />
    <title>Nareo · Tu patrimonio inmobiliario, bajo control</title>
    <script>
      // Apply the saved appearance before rendering to avoid a bright flash.
      try {
        const choice = localStorage.getItem("nareo-appearance");
        document.documentElement.dataset.theme =
          choice === "dark" ||
          (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
