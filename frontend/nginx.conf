map $uri $asset_cache {
    default "no-cache";
    ~^/assets/ "public, max-age=604800, immutable";
}
include /etc/nginx/seo-map.conf;

# Avoid storing password-reset / verification tokens, queries or Referer values.
log_format privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log privacy;

# The backend trusts this nginx hop, not arbitrary client Forwarded headers.
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;
    # Sanctum identifies same-origin GET requests from Referer when Origin is absent.
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $asset_cache always;
    add_header X-Robots-Tag $seo_robots always;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Generated only from the public-route allowlist, not from private user data.
    include /etc/nginx/seo-locations.conf;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /app.html { internal; }
    location = /index.html { return 308 /$is_args$args; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /support/inbox { try_files /app.html =404; }

    # Reloadable private SPA routes. Unknown URLs must return a real 404.
    location ~ ^/(login|register|forgot-password|reset-password|verify-email|support|dashboard|properties|leases|contacts|finance|reports|fiscality|issues|calendar|documents|settings|plans)/?$ {
        try_files /app.html =404;
    }
    location ~ ^/(properties|leases)/[^/]+/?$ { try_files /app.html =404; }

    location ~ /\. { deny all; }

    location ~ ^/(api|sanctum|stripe)/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $origin_scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_pass backend:9000;
        fastcgi_read_timeout 60s;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass backend:9000;
    }

    location / {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }
}
